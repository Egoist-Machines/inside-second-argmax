<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="title desc">
<title id="title">The sixteen-neuron recurrent state</title>
<desc id="desc">Neurons zero through fifteen at two consecutive updates. Arrows show the two largest-magnitude recurrent weights into each receiving neuron. Solid lines are positive; dashed lines are negative. Colours identify carriers, comparisons, carry and record, and delayed candidate and relay.</desc>

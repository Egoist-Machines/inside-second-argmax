<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 40 741 294" role="img" aria-labelledby="overview-title overview-desc">
  <title id="overview-title">Learned rank and position routes</title>
  <desc id="overview-desc">Approximate roles in the sixteen-neuron recurrent circuit. Carry and record neurons 2 and 4 drive input comparisons 1, 6, 7 and 8 and a newest-record penalty. Comparison contrasts contribute maximum-position suppression. Delayed signals 5 and 9 feed position carriers 0, 3 and 10 through 15; age transport and history-dependent threshold corrections feed back through the recurrent state. Rank and position routes contribute to the native readout, which retains all sixteen channels.</desc>
